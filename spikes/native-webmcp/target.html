<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Native WebMCP feasibility · Uninstrumented target</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/target.mjs"></script>
  </head>
  <body>
    <main>
      <h1>Uninstrumented target fixture</h1>
      <p>
        This page never registers or mocks WebMCP tools. Only an installed
        extension may add them. Its marker is test data, not a login session.
      </p>
      <p>Page instance: <output id="page-instance"></output></p>
      <label for="page-marker">Tab marker</label>
      <input id="page-marker" value="target-before-human-edit" />
      <form id="product-search" aria-label="Product search" method="get">
        <label for="query">Search products</label>
        <input id="query" name="q" type="search" required />
        <button type="submit">Search products</button>
      </form>
      <p id="search-status" role="status">No search has run.</p>
      <pre id="environment" aria-label="Target environment"></pre>
      <p><a href="/">Return to Studio fixture</a></p>
    </main>
  </body>
</html>
