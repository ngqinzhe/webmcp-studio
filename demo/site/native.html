<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Native WebMCP overlap · Demo</title>
    <link rel="stylesheet" href="/assets/demo.css" />
    <script src="/assets/shared.js"></script>
  </head>
  <body>
    <header><a href="/">← Demos</a><strong>Native + inferred</strong></header>
    <main>
      <h1>Native tool overlap</h1>
      <p class="lede">
        This page owns a native <code>search_products</code> tool. The extension
        should show it as Native and supplement it with the contact form.
      </p>
      <p class="status">
        Native tools before extension: <b>search_products</b>
      </p>
      <form aria-label="Contact support" id="contact-form">
        <label for="email"
          >Email<input id="email" name="email" type="email" required /></label
        ><label for="message"
          >Message<textarea
            id="message"
            name="message"
            required
          ></textarea></label
        ><button type="submit">Send message</button>
      </form>
      <p id="contact-status" class="status">No message sent.</p>
      <script>
        document
          .querySelector("#contact-form")
          .addEventListener("submit", function (event) {
            event.preventDefault();
            document.querySelector("#contact-status").textContent =
              "Support message sent through the visible form.";
          });
      </script>
    </main>
  </body>
</html>
